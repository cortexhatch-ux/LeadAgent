networks:
  leadagent-net:
    driver: bridge

services:

  # ── Agent containers ─────────────────────────────────────────────────────────
  # Each CLI runs in isolation. Auth dirs mounted from host — no re-auth needed.
  # Backend reaches them via: docker exec -i leadagent-claude claude -p "..."

  claude-agent:
    build:
      context: .
      dockerfile: agents/claude/Dockerfile
    container_name: leadagent-claude
    labels:
      - "com.leadagent.tag=true"
    environment:
      - LEADAGENT_TAG=true
    networks:
      - leadagent-net
    volumes:
      - .:/app/leadagent-data
      # Agent images run as the non-root `node` user, so auth lands in /home/node
      - ${HOME}/.claude:/home/node/.claude
      # NOTE: the Docker socket is deliberately NOT mounted here. An agent with
      # access to /var/run/docker.sock can start a privileged container and
      # escape to root on the host — a prompt-injected agent must not have it.
      # Mirror host projects path
      - ${LEADAGENT_WORKSPACE:-/tmp}:${LEADAGENT_WORKSPACE:-/tmp}
    restart: unless-stopped
    stdin_open: true
    tty: true

  gemini-agent:
    build:
      context: .
      dockerfile: agents/gemini/Dockerfile
    container_name: leadagent-gemini
    labels:
      - "com.leadagent.tag=true"
    environment:
      - LEADAGENT_TAG=true
    networks:
      - leadagent-net
    volumes:
      - .:/app/leadagent-data
      - ${HOME}/.gemini:/home/node/.gemini
      # Docker socket intentionally omitted — see claude-agent note.
      - ${HOME}/.config/google-chrome:/home/node/.config/google-chrome:ro
      - ${HOME}/.config/gcloud:/home/node/.config/gcloud:ro
      # Mirror host projects path
      - ${LEADAGENT_WORKSPACE:-/tmp}:${LEADAGENT_WORKSPACE:-/tmp}
    restart: unless-stopped
    stdin_open: true
    tty: true

  codex-agent:
    build:
      context: .
      dockerfile: agents/codex/Dockerfile
    container_name: leadagent-codex
    labels:
      - "com.leadagent.tag=true"
    environment:
      - LEADAGENT_TAG=true
    networks:
      - leadagent-net
    volumes:
      - .:/app/leadagent-data
      - ${HOME}/.codex:/home/node/.codex
      # Mirror host projects path
      - ${LEADAGENT_WORKSPACE:-/tmp}:${LEADAGENT_WORKSPACE:-/tmp}
    restart: unless-stopped
    stdin_open: true
    tty: true

  grok-agent:
    build:
      context: .
      dockerfile: agents/grok/Dockerfile
    container_name: leadagent-grok
    labels:
      - "com.leadagent.tag=true"
    environment:
      - LEADAGENT_TAG=true
    networks:
      - leadagent-net
    volumes:
      - .:/app/leadagent-data
      - ${HOME}/.grok/auth.json:/home/node/.grok/auth.json:ro
      # Mirror host projects path
      - ${LEADAGENT_WORKSPACE:-/tmp}:${LEADAGENT_WORKSPACE:-/tmp}
    restart: unless-stopped
    stdin_open: true
    tty: true

  # ── Main backend daemon ──────────────────────────────────────────────────────
  backend:
    build: .
    container_name: leadagent-backend
    labels:
      - "com.leadagent.tag=true"
    networks:
      - leadagent-net
    ports:
      # Bind to loopback only — the daemon must not be reachable from the LAN.
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/app/leadagent-data
      - /var/run/docker.sock:/var/run/docker.sock
      # Mirror host projects path
      - ${LEADAGENT_WORKSPACE:-/tmp}:${LEADAGENT_WORKSPACE:-/tmp}
    environment:
      - PYTHONPATH=/app/leadagent-data
      - TERM=xterm-256color
      - COLORTERM=truecolor
      - LEADAGENT_DOCKER_MODE=1
      - LEADAGENT_TAG=true
      - LEADAGENT_WORKSPACE=${LEADAGENT_WORKSPACE}
      # 3B is enough for the routing classifier; llama3 (8B, ~5.5 GB loaded)
      # cannot fit in this VM alongside the rest of the stack.
      - LEADAGENT_OLLAMA_MODEL=llama3.2:3b
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Hard cap so a memory spike OOM-kills inside this cgroup (restart policy
    # recovers it) instead of triggering a VM-wide kernel OOM kill.
    mem_limit: 2g
    restart: unless-stopped
    depends_on:
      - claude-agent
      - gemini-agent
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── Watchdog ─────────────────────────────────────────────────────────────────
  watchdog:
    build: .
    container_name: leadagent-watchdog
    labels:
      - "com.leadagent.tag=true"
    networks:
      - leadagent-net
    command: >
      sh -c "while true; do python backend/watchdog.py; sleep 30; done"
    volumes:
      - .:/app/leadagent-data
      - /var/run/docker.sock:/var/run/docker.sock
      # Mirror host projects path
      - ${LEADAGENT_WORKSPACE:-/tmp}:${LEADAGENT_WORKSPACE:-/tmp}
    environment:
      - PYTHONPATH=/app/leadagent-data
      - LEADAGENT_TAG=true
      - LEADAGENT_WORKSPACE=${LEADAGENT_WORKSPACE}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Runs the indexer (opens kuzu too) — same containment as the backend.
    mem_limit: 2g
    restart: unless-stopped
    depends_on:
      - backend

  # ── Slack Bot ───────────────────────────────────────────────────────────────
  slack-bot:
    build: .
    container_name: leadagent-slack-bot
    labels:
      - "com.leadagent.tag=true"
    networks:
      - leadagent-net
    command: python backend/slack_bot.py
    volumes:
      - .:/app/leadagent-data
      # No Docker socket: the Slack bot only forwards prompts to the backend.
      # Credentials are read-only — the bot never needs to refresh them.
      - ${HOME}/.claude:/root/.claude:ro
      - ${HOME}/.gemini:/root/.gemini:ro
      # Mirror host projects path
      - ${LEADAGENT_WORKSPACE:-/tmp}:${LEADAGENT_WORKSPACE:-/tmp}
    environment:
      - PYTHONPATH=/app/leadagent-data
      - LEADAGENT_TAG=true
      - LEADAGENT_DOCKER_MODE=1
      - LEADAGENT_WORKSPACE=${LEADAGENT_WORKSPACE}
    restart: unless-stopped
    depends_on:
      - backend

  # ── Local SLM (Ollama) ──────────────────────────────────────────────────────
  ollama:
    # Pinned — `latest` can silently change model/runtime behavior between pulls
    image: ollama/ollama:0.30.7
    container_name: leadagent-ollama
    labels:
      - "com.leadagent.tag=true"
    networks:
      - leadagent-net
    ports:
      - "11434:11434"
    volumes:
      - ./leadagent-data/ollama:/root/.ollama
    # Model loads are the biggest single allocation in the stack — it was an
    # ollama llama-server load that tripped the VM-wide OOM kill.
    mem_limit: 3g
    restart: unless-stopped

# NOTE — agentmemory is NOT included here.
# Start it natively before docker compose up:  agentmemory serve --port 3111
